<!-- PKG B-102 — the M1 map viewer (F01/F03/F07, D2/D3/D7, F52/D53). The
     panel regions landed across B-105/B-106/B-117/B-126/B-127 and were
     REGIMENED by B-133 (D91): the stage is FULL-WIDTH at both breakpoints
     and the four panels — route, arc, property, layer-manager — are
     OVERLAYS. On wide viewports each panel floats over the stage (the
     B-119 floating property regime generalized: remembered position per
     panel kind, a maximize toggle, best-effort avoid-the-selection
     placement — placement-only, never a pan); on narrow ones they overlay
     as bottom sheets in the .tme-sheets stack anchored to the stage's
     bottom (the B-129 cap arithmetic re-derived for the overlay world: the
     stack caps against the STAGE, nothing subtracts from it). A panel
     open/close never resizes the stage and never moves the viewport — the
     ResizeObserver only ever fires for the rail's collapse/expand and
     environmental resizes (D91's surviving resize classes). The stage keeps
     the canvas, the per-layer background, the R1 header, the breadcrumb,
     the selection chip and the draw-arc feedback banner; the editor rail
     (B-127, D86) stays the one control REGION — the left column on wide,
     the bottom bar on narrow. -->
<figure class="tme-viewer">
  <div class="tme-stage">
    @if (graph.activeBackground(); as asset) {
      <!-- F03/D29/D69: the active layer's background — a MODEL-SPACE surface
           as of B-134 (D92/D93): its placement arm
           (LayerData.backgroundPlacement — the service's live read joined
           with cy's viewport) positions it in the graph's coordinate plane
           and it pans/zooms 1:1 with the viewport; the app computes the
           aspect-locked fit-to-graph default ONCE per background-set /
           loadMap / layer-switch (never off a graph edit, D92), and a
           degenerate extent falls back to the D84 stage-contain shape
           (the bare SCSS rule — the callback clears its inline box). Never
           interactive; the node graph is always the interface on top.
           B-130 (D84/C32): a failed load degrades to NO background — the
           backgroundFailed flag hides the img (one [TravelMapper] warn, the
           canvas untouched); the flag re-arms on any src change, so a retry
           succeeds silently. B-132 (D90/D93): the per-layer background DIM
           applies here as the img's opacity TOWARD THE STAGE BACKDROP —
           `1 − dim` of the active layer's arm (the service's live read:
           follows layer switches and the D93 fresh-start reset through the
           editorRevision dependency). Presentational styling only — the
           displayed/edited value stays the core arm (R4); the value renders
           verbatim on the rail (R1). The dim binding is deliberately ONE
           style attribute: the B-134 D92 transform landed beside it as
           direct event-driven work (the B-113 cull precedent — high
           frequency, no signal writes), applied by the service's registered
           callback; the (load) report is the discrete seam that hands the
           service the natural size it cannot read off the DOM (D81). -->
      @if (!graph.backgroundFailed()) {
        <img
          class="tme-bg"
          data-testid="tme-bg"
          #bgImg
          [src]="asset"
          [style.opacity]="1 - graph.activeLayerDim()"
          alt=""
          (load)="noteBackgroundLoaded($event)"
          (error)="graph.backgroundLoadFailed()"
        />
      }
    }

    <!-- D53/§6.2: touch-action: none lives in the SCSS on this host so canvas
         gestures (tap, drag, pinch-zoom, pan) never scroll the host page. -->
    <div #canvasHost class="tme-canvas" data-testid="tme-canvas" aria-label="Map canvas"></div>

    <!-- R1: the header renders the snapshot's core strings verbatim — location,
         the PIN's layer name (not the active viewer layer), and the snapshot's
         cost unit. Degrades to empty strings when no snapshot exists (C32). -->
    <header class="tme-header" data-testid="tme-header">
      <span data-testid="tme-location">{{ graph.snapshot()?.location ?? '' }}</span>
      <span class="tme-sep" aria-hidden="true">·</span>
      <span data-testid="tme-snapshot-layer">{{ graph.snapshot()?.layer ?? '' }}</span>
      <span class="tme-sep" aria-hidden="true">·</span>
      <span data-testid="tme-unit">{{ graph.snapshot()?.unit ?? '' }}</span>
      <!-- B-116 (F45/D75) via the B-133 review (D91): the save dock — the
           app-bar pill form. It lived in the rail until the review showed a
           rail-flow dock resizes the narrow band on every dirty flip (the
           stage yields, the RO fires, a commit moves the viewport — B-124's
           commit-neutral pin). The header band is an absolute overlay that
           never joins the stage's flex flow (its own growth costs a sliver
           of canvas top, never a resize), so the dock here is commit-neutral
           by construction; the pill is pointer-events:auto inside the
           pointer-events:none header. The testid is unchanged. -->
      @if (graph.unsavedChanges()) {
        <aside class="tme-save-dock" data-testid="tme-save-dock" role="status" aria-label="Unsaved map changes">
          <span data-testid="tme-unsaved">Unsaved changes</span>
          @if (graph.saveError(); as err) {
            <span class="tme-save-error" data-testid="tme-save-error">{{ err }}</span>
          }
          <button type="button" class="tme-save" data-testid="tme-save" (click)="graph.saveMapToLibrary()">Save</button>
        </aside>
      }
    </header>

    <!-- B-128 (D85/F02): the breadcrumb bar — the ACTIVE layer's ancestor
         chain derived from the portal wiring (no separate parent field),
         rendered only when the chain is longer than one (a root layer has
         no bar). Plain name buttons (C23, >= 44px touch-alone F52/D53);
         a crumb tap = selectLayer(that layer) — the same viewport switch
         the rail's nav performs; the ACTIVE layer's crumb is the non-
         interactive tail (aria-current="page"). The chain and its names
         are the service's breadcrumb computed — authored words, no ids
         (R1/C23). Interactive chrome: joined the D81 clamp set (the
         component's INTERACTIVE_CHROME). -->
    @if (graph.breadcrumb().length > 1) {
      <nav class="tme-breadcrumb" data-testid="tme-breadcrumb" aria-label="Layer path">
        @for (crumb of graph.breadcrumb(); track crumb.id; let last = $last) {
          @if (last) {
            <span class="tme-crumb tme-crumb-active" data-testid="tme-crumb" aria-current="page">{{ crumb.name }}</span>
          } @else {
            <button type="button" class="tme-crumb" data-testid="tme-crumb" (click)="selectLayer(crumb.id)">
              {{ crumb.name }}
            </button>
          }
          @if (!last) {
            <span class="tme-crumb-sep" aria-hidden="true">›</span>
          }
        }
      </nav>
    }

    <!-- B-103 selection chip (D2/D53/F52): template-bound to the selection
         signal — visible only while a node is selected. The whole chip is ONE
         >= 44px tap target that dismisses the selection (the x is the visual
         dismiss affordance), so touch alone needs no hover (F52/D53);
         touch-action: manipulation in SCSS kills double-tap zoom on the chrome
         (§6.2). D86: the chip is NOT on the rail (it names the live selection
         beside the canvas) — it stays on the stage and stays a clamp chrome
         rect. -->
    @if (graph.selection(); as sel) {
      <button type="button" class="tme-chip" data-testid="tme-selection-chip" (click)="dismissSelection()">
        <span data-testid="tme-selection-label">{{ sel.label }}</span>
        <span class="tme-chip-dismiss" aria-hidden="true">×</span>
      </button>
    }

    <!-- B-122 (F17/C3 + C23): the draw-arc refusal banner — why the last
         Arc-tool tap refused (the cross-layer fence), plain words, rendered
         only while the Arc tool is active and a refusal stands. A status
         message, not a control: pointer-events none so a dismissive
         background tap still reaches the canvas (and cancels the pick).
         D86: the banner is not rail chrome — it stays where it is. -->
    @if (graph.editorMode() && graph.editorTool() === 'arc' && graph.drawArcFeedback(); as feedback) {
      <p class="tme-draw-feedback" data-testid="tme-draw-feedback" role="status">
        {{ feedback }}
      </p>
    }

    <!-- B-135 (D93/F56): the CALIBRATE MODE surface — the stage-top band
         (the draw-arc banner precedent for a stage-level mode state; a
         compact overlay band, not a canvas-blocking scrim: the drag IS the
         calibrate gesture and must reach the canvas below). Badge line in
         plain words (C23); the controls row is the mode's whole affordance
         set: the aspect-locked scale STEPPER (− / +, one multiplicative
         ×1.25 step per committed tap — the readout renders the image size
         as a percentage of the D92 default fit, presentation arithmetic
         over the core arm, the 1−dim styling's class; hidden honestly when
         the default is degenerate), Fit to graph (the ONE shared default
         derivation; disabled when the extents are degenerate — the F07
         dead-control reasoning), and Done/Cancel (Done flushes an in-flight
         draft; Cancel discards only that — committed gestures stand, F46).
         Every control >= 44px, touch-alone (F52/D53); the band is an
         absolute overlay — it never joins the stage's layout flow (the
         save-dock/commit-neutral discipline, D91). -->
    @if (graph.calibrateMode()) {
      <div class="tme-calibrate" data-testid="tme-calibrate" role="group" aria-label="Calibrate the background image">
        <p class="tme-calibrate-badge" data-testid="tme-calibrate-badge" role="status">
          Calibrating — drag the map to move the image
        </p>
        <div class="tme-calibrate-bar">
          @if (calibrateScalePercent(); as percent) {
            <span class="tme-calibrate-scale" data-testid="tme-calibrate-scale" aria-label="Image size">{{ percent }}%</span>
          }
          <button
            type="button"
            class="tme-calibrate-button"
            data-testid="tme-calibrate-scale-down"
            aria-label="Shrink the background image"
            (click)="graph.calibrateScaleStep(1 / 1.25)"
          >
            −
          </button>
          <button
            type="button"
            class="tme-calibrate-button"
            data-testid="tme-calibrate-scale-up"
            aria-label="Enlarge the background image"
            (click)="graph.calibrateScaleStep(1.25)"
          >
            +
          </button>
          <button
            type="button"
            class="tme-calibrate-button"
            data-testid="tme-calibrate-fit"
            [disabled]="!graph.activeDefaultPlacement()"
            (click)="graph.calibrateFitToGraph()"
          >
            Fit to graph
          </button>
          <button
            type="button"
            class="tme-calibrate-button tme-calibrate-primary"
            data-testid="tme-calibrate-done"
            (click)="graph.calibrateDone()"
          >
            Done
          </button>
          <button
            type="button"
            class="tme-calibrate-button"
            data-testid="tme-calibrate-cancel"
            (click)="graph.calibrateCancel()"
          >
            Cancel
          </button>
        </div>
      </div>
    }

    <!-- B-137 (D79): the one-time calibrate HINT — after a NEW map is
         created (and only then): plain words (C23) stating the D79 default
         scale and the explicit-action rule; informational, never blocking
         (D10/D30 spirit). One >= 44px Dismiss tap target (F52); dismissal
         is per-map, session-memory (the service's signal). Hidden while the
         calibrate MODE band owns this top-center slot (the two never
         compete — calibrating a placement is not calibrateScale, so the
         hint can still be up; the band returns it after the mode ends). -->
    @if (graph.calibrateHint() !== null && !graph.calibrateMode()) {
      <aside class="tme-hint" data-testid="tme-calibrate-hint" role="status" aria-label="Scale hint">
        <span class="tme-hint-text">{{ graph.calibrateHint() }}</span>
        <button
          type="button"
          class="tme-hint-dismiss"
          data-testid="tme-calibrate-hint-dismiss"
          aria-label="Dismiss the scale hint"
          (click)="graph.dismissCalibrateHint()"
        >
          ×
        </button>
      </aside>
    }

    <!-- B-133 (D91): the four PANEL SURFACES — overlays over this stage.
         NARROW (the default): .tme-sheets is the bottom-sheet STACK anchored
         to the stage's bottom edge (absolute, pointer-events none on the
         stack, auto on the sheets — the uncovered stage stays fully
         interactive); the sheets cap against the stage via the stack, and
         the stage's height never depends on them (a sheet open/close resizes
         nothing — D91). WIDE (>= 700px): the stack dissolves (display:
         contents) and each panel host floats position:fixed over the stage
         under its own component SCSS (the B-119 surface generalized). DOM
         order = stack paint order (route, arc, property, manager). Panel
         CONTENT testids are byte-verbatim from the region era; only the
         regime wrappers changed. -->
    <div class="tme-sheets">
      <!-- B-105: the route panel — wide: auto-floats while it has content
           (routes / blocked listings from the snapshot projection), summoned
           empty by the rail's Route toggle (tme-route-toggle); narrow: the
           B-114 bottom sheet with its always-visible rail, unchanged. -->
      <tme-route-panel class="tme-panel" />

      <!-- B-106 (rulings 1/3): the arc panel — rendered only while an edge
           is selected (an edge tap cleared the node selection, so the
           chip/route target are already gone — the panels never fight over
           one selection). -->
      @if (graph.edgeSelection()) {
        <tme-arc-panel class="tme-arc-panel" />
      }

      <!-- B-117 (§5 Phase 3 M1/F40/F46): the property panel — editor mode
           with a node selection only (the draft gate lives inside the
           component; an edge selection — the arc panel's surface — can
           never coexist with a node selection, B-106). -->
      <tme-property-panel class="tme-property-panel" />

      <!-- B-126 (§5 Phase 3 M3/D82): the layer-manager sheet — the Manage
           affordance's surface; the component hides its host entirely while
           closed (the B-117 precedent), so closed it is not even painted. -->
      <tme-layer-manager class="tme-layer-manager" />

      <!-- B-137 (§5 M4/D40): the Maps manager panel — the library surface
           (open/new/duplicate/delete), the mapless boot's auto-opened
           picker. Same hide-while-closed discipline; DOM order = stack
           paint order. -->
      <tme-maps-panel class="tme-maps-panel" />
    </div>
  </div>

  <!-- B-127 (§5 Phase 3 M3/D86/F53): the editor rail — the app's single
       control surface (editor/view mode, the tool picks, the layer switcher
       + Manage + the D91 Route toggle, the zoom trio, the save dock). The
       NARROW default (no media query needed) is the bottom bar under the
       stage; the wide media query moves it FIRST (order: -1, the left
       column). Its host rect is the clamp's measured chrome ('.tme-rail'),
       and its collapse/expand is the ONE panel-driven resize the D91
       discriminator classifies (preserve + rescue clamp on wide, refit on
       narrow). Renders in BOTH modes — the mode toggle lives on it. -->
  <tme-editor-rail class="tme-rail" data-testid="tme-rail" />
</figure>
