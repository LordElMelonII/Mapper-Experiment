<!-- PKG B-102 — the M1 map viewer (F01/F03/F07, D2/D3/D7, F52/D53), extended
     by B-105: the route panel joins as a sibling REGION of the map stage —
     beside it on wide viewports, stacked below it on narrow ones (ruling 5).
     B-106: the arc panel joins as a third region — beside the route panel on
     wide viewports, under it on narrow ones (ruling 3) — and renders ONLY
     while an edge is selected (ruling 1: mutually exclusive with the node
     selection, so the two panels never fight for the same slot). B-116 (§5
     Phase 3 M1): editor chrome joins the stage's top-right chrome stack —
     the editor toggle above the selection chip, and the F45 save dock below
     it (rendered only while the facade holds unsaved editor edits). B-117:
     the property panel joins as the fourth region — editor mode with a node
     selection only (an edge selection never shows it: the B-106 mutual
     exclusion); the panel hides its host entirely when it has no open
     draft, so it occupies no slot otherwise. -->
<figure class="tme-viewer">
  <div class="tme-stage">
    @if (graph.activeBackground(); as asset) {
      <!-- F03/D29/D69: the active layer's background — fitted + centered
           (object-fit contain letterboxes aspect mismatch), never interactive;
           the node graph is always the interface on top. -->
      <img class="tme-bg" data-testid="tme-bg" [src]="asset" alt="" />
    }

    <!-- D53/§6.2: touch-action: none lives in the SCSS on this host so canvas
         gestures (tap, drag, pinch-zoom, pan) never scroll the host page. -->
    <div #canvasHost class="tme-canvas" data-testid="tme-canvas" aria-label="Map canvas"></div>

    <!-- R1: the header renders the snapshot's core strings verbatim — location,
         the PIN's layer name (not the active viewer layer), and the snapshot's
         cost unit. Degrades to empty strings when no snapshot exists (C32). -->
    <header class="tme-header" data-testid="tme-header">
      <span data-testid="tme-location">{{ graph.snapshot()?.location ?? '' }}</span>
      <span class="tme-sep" aria-hidden="true">·</span>
      <span data-testid="tme-snapshot-layer">{{ graph.snapshot()?.layer ?? '' }}</span>
      <span class="tme-sep" aria-hidden="true">·</span>
      <span data-testid="tme-unit">{{ graph.snapshot()?.unit ?? '' }}</span>
    </header>

    <!-- F01/F02 (M1 scope): layer switcher only — the breadcrumb is F02's full
         scope in Phase 3. One button per layer, >= 44px tap target (F52). -->
    <nav class="tme-layers" aria-label="Map layers">
      @for (layer of graph.layerNames(); track layer.id) {
        <button
          type="button"
          class="tme-layer-button"
          [class.tme-active]="layer.id === graph.activeLayer()"
          [attr.data-testid]="'tme-layer-' + layer.id"
          (click)="selectLayer(layer.id)"
        >
          {{ layer.name }}
        </button>
      }
    </nav>

    <!-- B-103 selection chip (D2/D53/F52): template-bound to the selection
         signal — visible only while a node is selected. The whole chip is ONE
         >= 44px tap target that dismisses the selection (the x is the visual
         dismiss affordance), so touch alone needs no hover (F52/D53);
         touch-action: manipulation in SCSS kills double-tap zoom on the chrome
         (§6.2). -->
    @if (graph.selection(); as sel) {
      <button type="button" class="tme-chip" data-testid="tme-selection-chip" (click)="dismissSelection()">
        <span data-testid="tme-selection-label">{{ sel.label }}</span>
        <span class="tme-chip-dismiss" aria-hidden="true">×</span>
      </button>
    }

    <!-- B-116 (§5 Phase 3 M1/D53/F52): the editor toggle — always visible, one
         >= 44px tap target whose pressed state (aria-pressed + the gold
         tme-active class bound to the editorMode signal, R3) tells the author
         that canvas taps place nodes and node drags persist. Plain words
         (C23); touch alone operates it (tap, no hover). -->
    <button
      type="button"
      class="tme-editor-toggle"
      data-testid="tme-editor-toggle"
      [class.tme-active]="graph.editorMode()"
      [attr.aria-pressed]="graph.editorMode() ? 'true' : 'false'"
      (click)="toggleEditor()"
    >
      {{ graph.editorMode() ? 'Editing' : 'Edit' }}
    </button>

    <!-- B-120 (D76/F52/D53): the editor's segmented TOOL control — what an
         editor-mode background/compound-box tap places: Node (default, the
         B-116 authored-node behavior) or Waypoint (the B-109 chat-waypoint
         semantics, kNN and all). Editor chrome only (view mode never renders
         it — view mode is purely navigational, nothing is ever placed); one
         >= 44px segment per tool; the pressed state (aria-pressed + the gold
         tme-active class bound to the editorTool signal, R3) makes the
         active placement kind visible — no invisible affordance (D53).
         Plain words (C23); touch alone operates it. Extensible: draw-arc
         joins the same control as a third segment in B-122. -->
    @if (graph.editorMode()) {
      <div class="tme-tools" role="group" aria-label="Editor tools" data-testid="tme-editor-tools">
        <button
          type="button"
          class="tme-tool"
          data-testid="tme-tool-node"
          [class.tme-active]="graph.editorTool() === 'node'"
          [attr.aria-pressed]="graph.editorTool() === 'node' ? 'true' : 'false'"
          (click)="setEditorTool('node')"
        >
          Node
        </button>
        <button
          type="button"
          class="tme-tool"
          data-testid="tme-tool-waypoint"
          [class.tme-active]="graph.editorTool() === 'waypoint'"
          [attr.aria-pressed]="graph.editorTool() === 'waypoint' ? 'true' : 'false'"
          (click)="setEditorTool('waypoint')"
        >
          Waypoint
        </button>
      </div>
    }

    <!-- B-116 (F45/D75): the save dock — the F45 unsaved-changes indicator
         (the core's dirty flag is the single truth, R1) PLUS the Save button,
         rendered exactly while the facade still holds unsaved editor edits,
         so it survives editor-mode toggles (F45: edits live until saveMap).
         A C30 save refusal surfaces user-visibly through graph.saveError
         (the established signal → template message path, never console-only)
         while the dock stays (dirty remains true after a refusal). -->
    @if (graph.unsavedChanges()) {
      <aside class="tme-save-dock" data-testid="tme-save-dock" role="status" aria-label="Unsaved map changes">
        <span data-testid="tme-unsaved">Unsaved changes</span>
        @if (graph.saveError(); as err) {
          <span class="tme-save-error" data-testid="tme-save-error">{{ err }}</span>
        }
        <button type="button" class="tme-save" data-testid="tme-save" (click)="saveMap()">Save</button>
      </aside>
    }
  </div>

  <!-- B-105 (ruling 5): the route sidebar — beside the stage on wide
       viewports, stacked below it on narrow ones (the SCSS owns which). -->
  <tme-route-panel class="tme-panel" />

  <!-- B-106 (rulings 1/3): the arc panel — beside the route panel on wide
       viewports, under it on narrow ones; rendered only while an edge is
       selected (an edge tap cleared the node selection, so the chip/route
       target are already gone — the two panels never coexist on one
       selection). -->
  @if (graph.edgeSelection()) {
    <tme-arc-panel class="tme-arc-panel" />
  }

  <!-- B-117 (§5 Phase 3 M1/F40/F46): the property panel — the fourth region,
       beside the others on wide viewports, stacked under them on narrow ones
       (the SCSS owns which). Editor mode + node selection only (the draft
       gate lives inside the component; an edge selection — the arc panel's
       slot — can never coexist with a node selection, B-106). -->
  <tme-property-panel class="tme-property-panel" />
</figure>
