<!-- PKG B-127 (§5 Phase 3 M3, D86/F53) — the editor RAIL: the app's single
     control surface. Every control here MIGRATED from the stage's scattered
     chrome with its testid and semantics verbatim (the top-right
     editor-toggle/save stack, the bottom-right tools group, the bottom-left
     layer nav — nothing remains in duplicate); the chip, the header and the
     draw-arc banner stay on the stage. Sections run top-to-bottom on the
     wide column / left-to-right on the narrow bar: the editor/view toggle,
     the tool group (editor mode only — the existing conditional) and the
     layer switcher + Manage in the BODY; then the zoom trio, the save dock
     (exactly while unsavedChanges()) and the collapse toggle as host
     siblings — so the wide column keeps D86's section order while the
     narrow bar shares ONE band between the trio and the toggle (a two-band
     phone rail: the map stays the primary surface, D53). F52/D53: every
     control >= 44px and touch-alone; the collapse toggle (>= 44px) reduces
     the rail to a slim strip carrying only the expand affordance. C23:
     plain words or +/−/Fit glyphs.
     B-D1 (R29, PROPOSAL-D §2.1) — the THIRD regime: at >=1024px this host
     becomes the 56px vertical ICON TOOLBELT. The words become glyphs with
     aria-label/title/data-tip (all shell-gated: below 1024 the DOM is
     byte-identical — the attributes render null); the mode toggle and the
     dim row LEAVE the belt (their header homes render in map-viewer through
     the same shellWide gates — ONE instance per testid per regime, R29
     ruling 2); the per-layer nav and Manage leave too (the belt's single
     Layers icon opens the manager, whose row names are the switch surface);
     the collapse toggle hides (a 56px belt has nothing to collapse). The
     D81 700px breakpoint stays the layout authority; the shell query never
     feeds resize classification. -->
<div class="tme-rail-body" id="tme-rail-body">
  <!-- B-116 (§5 Phase 3 M1/D53/F52): the editor toggle — one >= 44px tap
       target whose pressed state (aria-pressed + the gold tme-active class
       bound to the editorMode signal, R3) tells the author that canvas taps
       place nodes and node drags persist. Plain words (C23); touch alone
       operates it (tap, no hover). B-D1: DUAL-HOME — this copy renders only
       below 1024px; at >=1024 the header pill in map-viewer carries the
       same testid/contract (never two instances). Both homes call the ONE
       service write path toggleEditorMode() (R3). -->
  @if (!graph.shellWide()) {
    <button
      type="button"
      class="tme-editor-toggle"
      data-testid="tme-editor-toggle"
      [class.tme-active]="graph.editorMode()"
      [attr.aria-pressed]="graph.editorMode() ? 'true' : 'false'"
      [disabled]="!graph.hasMap()"
      (click)="toggleEditor()"
    >
      {{ graph.editorMode() ? 'Editing' : 'Edit' }}
    </button>
  }

  <!-- B-120 (D76/F52/D53): the editor's segmented TOOL control — what an
       editor-mode background/compound-box tap places: Node (default) or
       Waypoint; B-122's third segment Arc — leaf taps pick arc endpoints.
       Editor chrome only (view mode never renders it). One >= 44px segment
       per tool; the pressed state (aria-pressed + the gold tme-active class
       bound to the editorTool signal, R3) makes the active placement kind
       visible — no invisible affordance (D53). Plain words (C23).
       B-D1: at >=1024 the words become glyphs (24px) with shell-gated
       aria-label/title/data-tip — the testid, the active/pressed bindings
       and the click path are unchanged. -->
  @if (graph.editorMode()) {
    <div class="tme-tools" role="group" aria-label="Editor tools" data-testid="tme-editor-tools">
      <button
        type="button"
        class="tme-tool"
        data-testid="tme-tool-node"
        [class.tme-active]="graph.editorTool() === 'node'"
        [attr.aria-pressed]="graph.editorTool() === 'node' ? 'true' : 'false'"
        [attr.aria-label]="beltWord('Node')"
        [attr.title]="beltWord('Node')"
        [attr.data-tip]="beltWord('Node')"
        (click)="setEditorTool('node')"
      >
        {{ graph.shellWide() ? '●' : 'Node' }}
      </button>
      <button
        type="button"
        class="tme-tool"
        data-testid="tme-tool-waypoint"
        [class.tme-active]="graph.editorTool() === 'waypoint'"
        [attr.aria-pressed]="graph.editorTool() === 'waypoint' ? 'true' : 'false'"
        [attr.aria-label]="beltWord('Waypoint')"
        [attr.title]="beltWord('Waypoint')"
        [attr.data-tip]="beltWord('Waypoint')"
        (click)="setEditorTool('waypoint')"
      >
        {{ graph.shellWide() ? '◆' : 'Waypoint' }}
      </button>
      <button
        type="button"
        class="tme-tool"
        data-testid="tme-tool-arc"
        [class.tme-active]="graph.editorTool() === 'arc'"
        [attr.aria-pressed]="graph.editorTool() === 'arc' ? 'true' : 'false'"
        [attr.aria-label]="beltWord('Arc')"
        [attr.title]="beltWord('Arc')"
        [attr.data-tip]="beltWord('Arc')"
        (click)="setEditorTool('arc')"
      >
        {{ graph.shellWide() ? '◠' : 'Arc' }}
      </button>
    </div>
  }

  <!-- F01/F02: the layer switcher — one >= 44px button per layer (F52).
       B-126 (D82): the compact switcher keeps its Manage affordance at the
       end — the layer-manager sheet's only entry (plain word, C23; the nav
       stays the switcher, the sheet manages).
       B-D1: BOTH the per-layer buttons and Manage render only below 1024 —
       at >=1024 the belt's Layers icon (below) is the manager entry and the
       manager's row names are the switch surface (layer-manager.component);
       template gates, never CSS hiding, so no testid ever renders twice. -->
  <nav class="tme-layers" aria-label="Map layers">
    @if (!graph.shellWide()) {
      @for (layer of graph.layerNames(); track layer.id) {
        <button
          type="button"
          class="tme-layer-button"
          [class.tme-active]="layer.id === graph.activeLayer()"
          [attr.data-testid]="'tme-layer-' + layer.id"
          (click)="selectLayer(layer.id)"
        >
          {{ layer.name }}
        </button>
      }
      <button
        type="button"
        class="tme-layer-button tme-manage"
        data-testid="tme-layer-manage"
        [class.tme-active]="graph.layerManagerOpen()"
        [attr.aria-pressed]="graph.layerManagerOpen() ? 'true' : 'false'"
        (click)="toggleLayerManager()"
      >
        Manage
      </button>
    }

    <!-- B-137 (§5 M4/D40): the Maps panel's affordance — the D82 Manage
         pattern exactly (a nav sibling, present in BOTH worlds; the phone
         bottom-rail regime stays untouched — no bar re-wrap in editor
         mode, no standing chrome anywhere). Pressed state mirrors the
         signal (R3), plain word (C23), >= 44px (F52). The mapless state
         keeps it reachable: the nav renders with no layer buttons and
         Manage/Maps remain (the picker is never stranded, D40).
         B-D1: at >=1024 it is a belt icon (glyph + shell-gated word
         attributes); the testid and click path are unchanged. -->
    <button
      type="button"
      class="tme-layer-button tme-maps-nav"
      data-testid="tme-maps-toggle"
      [class.tme-active]="graph.mapsPanelOpen()"
      [attr.aria-pressed]="graph.mapsPanelOpen() ? 'true' : 'false'"
      [attr.aria-label]="beltWord('Maps')"
      [attr.title]="beltWord('Maps')"
      [attr.data-tip]="beltWord('Maps')"
      (click)="toggleMapsPanel()"
    >
      {{ graph.shellWide() ? '▦' : 'Maps' }}
    </button>
  </nav>

  <!-- B-133 (D91): the Route panel's summon — the wide floater's toggle.
       The route panel auto-floats while it has content (the service's
       routePanelOpen rule); this is how a user summons it EMPTY (to see why
       there are no routes, if nothing else) and closes it again. WIDE-ONLY
       chrome: the narrow layout's sheet rail (tme-sheet-rail on the panel)
       is that world's summon — do not duplicate it here (the packet's
       no-duplicate rule), so the media query hides this button below 700px
       and the phone bottom-rail regime keeps its two bands. >= 44px (F52),
       pressed state mirrors the signal (R3), plain word (C23).
       B-D1: at >=1024 it is a belt icon (glyph + shell-gated word
       attributes); the testid and click path are unchanged. -->
  <button
    type="button"
    class="tme-route-toggle"
    data-testid="tme-route-toggle"
    [class.tme-active]="graph.routePanelOpen()"
    [attr.aria-pressed]="graph.routePanelOpen() ? 'true' : 'false'"
    [attr.aria-label]="beltWord('Route')"
    [attr.title]="beltWord('Route')"
    [attr.data-tip]="beltWord('Route')"
    (click)="toggleRoutePanel()"
  >
    {{ graph.shellWide() ? '→' : 'Route' }}
  </button>

  <!-- B-D1 (R29, PROPOSAL-D §2.1): the belt's LAYERS tool — at >=1024 the
       single layer-manager entry (the per-layer nav and Manage are gated
       off above; the manager's row names are the switch surface, the
       breadcrumb keeps chain navigation). New testid, belt-only render
       (never a duplicate), aria-pressed mirrors layerManagerOpen (R3), the
       plain word in the shell-gated label attributes (C23); the divider
       above it (SCSS border) is the belt's Route|Layers separation. -->
  @if (graph.shellWide()) {
    <button
      type="button"
      class="tme-layer-tool"
      data-testid="tme-layers-tool"
      [class.tme-active]="graph.layerManagerOpen()"
      [attr.aria-pressed]="graph.layerManagerOpen() ? 'true' : 'false'"
      [attr.aria-label]="beltWord('Layers')"
      [attr.title]="beltWord('Layers')"
      [attr.data-tip]="beltWord('Layers')"
      (click)="toggleLayerManager()"
    >
      ≡
    </button>
  }

  <!-- B-147 (REPAIRS R-7): the node-kind legend — the canvas taxonomy's key
       (the recognition finding: no glossary anywhere). Static rows (the
       four visually-distinct canvas classes), component-local collapse
       state, default collapsed (reference material, not an action surface).
       SLOT: the BODY's flow END — after the layers nav / Route toggle, so
       D86's section order is untouched; wide it stacks as the body's last
       section (the body scrolls its own overflow), narrow it wraps into the
       first band (a legend toggle is one more wrapped control — no third
       band, the B-129 rail-band arithmetic intact: the collapsed strip
       still hides it with the body).
       B-D1: at >=1024 its toggle is one belt icon and the expanded rows
       render as an absolute plate RIGHT of the belt (legend.component). -->
  <tme-legend />
</div>

<!-- B-132 (D90/D93/F56): the ACTIVE layer's per-layer background DIM — a
     presentation control for the layer the switcher above selects (the
     packet's per-layer neighborhood). Bound to the service's live reads
     (R4): the thumb value is `activeLayerDim` (absent arm ⇒ 0), committed
     on every input tick through `setActiveLayerDim` (map data — the save
     dock lights per tick, D75, and the thumb re-binds from the re-read so
     a D93 fresh-start background reset visibly returns it to 0). DISABLED
     while the active layer has no background reference (the F07 dead-
     control gate — a dim without an image is not offered; disabled, not
     hidden, per the packet ruling). The numeric readout renders the arm
     verbatim (R1 — the 1−dim styling lives at the img). Follows the layer
     switch through the same reads (D90). Plain words (C23); >= 44px tap
     target, touch-alone, no hover affordance (F52/D53); renders in BOTH
     modes. SLOT (the packet's layout call, within the existing rail
     structure): a HOST SIBLING directly under the body — on the wide
     column it sits immediately under the layers nav (beside the
     switcher); on the narrow bar it joins the zoom/rail-toggle band
     (compact, flex-shrinkable) because the body's two wrapped bands are
     the B-129 rail-band arithmetic's basis — a third band would starve
     the stage floor / panel caps (the phone bottom-rail regime stays
     untouched; measured against the B-104/D81/§6.2 narrow cells).
     B-D1: DUAL-HOME — this copy renders only below 1024px; at >=1024 the
     header pill in map-viewer carries the same testids/bindings (never
     two instances, R29 ruling 2). -->
@if (!graph.shellWide()) {
  <div class="tme-dim" data-testid="tme-dim">
    <label class="tme-dim-label" for="tme-dim-slider">Dim</label>
    <input
      class="tme-dim-slider"
      id="tme-dim-slider"
      data-testid="tme-dim-slider"
      type="range"
      min="0"
      max="1"
      step="0.05"
      [value]="graph.activeLayerDim()"
      [disabled]="!graph.activeLayerHasBackground()"
      (input)="setDim($event)"
    />
    <span class="tme-dim-value" data-testid="tme-dim-value">{{ graph.activeLayerDim() }}</span>
  </div>
}

<!-- B-127 (D86): the zoom trio — one >= 44px button each (F52), the C23
     glyphs/words (+, −, Fit). Viewport commands of the service (R2); they
     write no signals (D2) and work identically in both modes — zooming is
     navigational, never an edit. A SIBLING of the body (not inside it) so
     the narrow bar shares ONE band between the trio and the collapse
     toggle below — the two-band phone rail (D53: the map stays the primary
     surface; the rail never grows a third band).
     B-D1: at >=1024 the trio is the belt's stacked zoom cluster (compact
     icons; Fit keeps its 3-char word); testids and click paths unchanged. -->
<div class="tme-zoom" role="group" aria-label="Zoom" data-testid="tme-zoom">
  <button
    type="button"
    class="tme-zoom-button"
    data-testid="tme-zoom-in"
    aria-label="Zoom in"
    [attr.title]="beltWord('Zoom in')"
    [attr.data-tip]="beltWord('Zoom in')"
    (click)="zoomIn()"
  >
    +
  </button>
  <button
    type="button"
    class="tme-zoom-button"
    data-testid="tme-zoom-out"
    aria-label="Zoom out"
    [attr.title]="beltWord('Zoom out')"
    [attr.data-tip]="beltWord('Zoom out')"
    (click)="zoomOut()"
  >
    −
  </button>
  <button
    type="button"
    class="tme-zoom-button"
    data-testid="tme-zoom-fit"
    [attr.aria-label]="beltWord('Fit')"
    [attr.title]="beltWord('Fit')"
    [attr.data-tip]="beltWord('Fit')"
    (click)="fitToView()"
  >
    Fit
  </button>
</div>

<!-- B-116 (F45/D75): the save dock lived here until the B-133 review (D91):
     as a rail flow child its dirty/clean flip resized the narrow band (the
     stage yielded, the RO fired, a commit moved the viewport — B-124's
     commit-neutral pin broken) and every layout-neutral alternative
     (reserved row, overlay over the bar or the sheet rail) either starved
     the boot-fit zoom or covered B-114's always-reachable sheet rail. It
     moved to the map-viewer's header band — the chip idiom's sibling: a
     transient, commit-neutral stage overlay. The testid is unchanged. -->

<!-- The rail's collapse toggle — one >= 44px tap target (F52), the only
     control the collapsed strip carries. The state is component-local (the
     B-114 precedent); the region shrink/grow is an ordinary container
     resize the D81 discriminator classifies (preserve on wide, refit on
     narrow). Plain words (C23); no hover affordance.
     B-D1: display:none at >=1024 (SCSS — collapsing a 56px belt is
     pointless; a collapse made below 1024 does not persist into the shell:
     the belt SCSS re-shows the body and the region keeps its 56px basis). -->
<button
  type="button"
  class="tme-rail-toggle"
  data-testid="tme-rail-toggle"
  [attr.aria-expanded]="!collapsed()"
  aria-controls="tme-rail-body"
  (click)="toggleRail()"
>
  {{ collapsed() ? 'Show' : 'Hide' }}
</button>
